name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    container:
      # The CKAN version tag of the Solr and Postgres containers should match
      # the one of the container the tests run on.
      # You can switch this base image with a custom image tailored to your project
      image: ckan/ckan-dev:2.12
    services:
      solr:
        image: ckan/ckan-solr:2.12-solr9
      # ckan/ckan-postgres-dev has no pg_cron, which most tests need. This image
      # preloads it, with cron.database_name = 'postgres'.
      postgres:
        image: supabase/postgres:15.8.1.060
        env:
          POSTGRES_PASSWORD: pass
        options: --health-cmd "pg_isready -U postgres -h localhost" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
          image: redis:3

    env:
      CKAN_SQLALCHEMY_URL: postgresql://ckan_default:pass@postgres/ckan_test
      CKAN_DATASTORE_WRITE_URL: postgresql://ckan_default:pass@postgres/datastore_test
      CKAN_DATASTORE_READ_URL: postgresql://ckan_default:pass@postgres/datastore_test
      CKAN_SOLR_URL: http://solr:8983/solr/ckan
      CKAN_REDIS_URL: redis://redis:6379/1

    steps:
    - uses: actions/checkout@v4
    - name: Install requirements
      # Install any extra requirements your extension has here (dev requirements, other extensions etc)
      run: |
        pip install -r requirements.txt
        pip install -r dev-requirements.txt
        pip install -e .
    - name: Setup extension
      # Extra initialization steps
      run: |
        # Replace default path to CKAN core config file with the one on the container
        sed -i -e 's/use = config:.*/use = config:\/srv\/app\/src\/ckan\/test-core.ini/' test.ini
        sed -i -e 's|^# ckanext.cron.database_url = .*|ckanext.cron.database_url = postgresql://ckan_default:pass@postgres/postgres|' test.ini

        python .github/scripts/setup_pg_cron.py postgresql://supabase_admin:pass@postgres/postgres
        ckan -c test.ini db init
    - name: Run tests
      run: pytest --ckan-ini=test.ini --cov=ckanext.cron --disable-warnings ckanext/cron

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
